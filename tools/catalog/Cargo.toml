[package]
name = "quake-catalog"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
